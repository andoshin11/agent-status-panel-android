name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      # The real file comes from the Firebase console and is not in the repository.
      - run: cp ci/google-services.json app/google-services.json

      - run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug
